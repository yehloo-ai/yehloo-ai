 let lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(lines,3));model.add(new T.LineSegments(lg,new T.LineBasicMaterial({color:0x8e6528,transparent:true,opacity:.45})));
 const axisPositions=[];for(let z=-492;z<550;z+=15)axisPositions.push(0,42,z,0,42,z+8);const ag=new T.BufferGeometry();ag.setAttribute('position',new T.Float32BufferAttribute(axisPositions,3));const axis=new T.LineSegments(ag,new T.LineBasicMaterial({color:0x4aa8ad,transparent:true,opacity:.65,depthTest:false}));scene.add(axis);
 // Projected labels; declutter dynamically as the viewpoint changes.
 const tagLayer=root.querySelector('.palace-tags');picks.forEach((p,i)=>{const el=document.createElement('button');el.type='button';el.className='palace-tag';el.textContent=p.name;el.addEventListener('click',()=>{const b=buildings.find(b=>b.name===p.name);if(b)parent.postMessage({type:'palace-select',building:b},location.origin);});tagLayer.appendChild(el);p.el=el;p.priority=['太和殿','午门','神武门','乾清宫','保和殿','中和殿'].includes(p.name)?0:1;});picks.sort((a,b)=>a.priority-b.priority);
 let theta=.24,phi=.82,radius=1680,target=new T.Vector3(0,0,20),dirty=true,labelOn=true,previousAspect=null;
 function draw(){if(!dirty)return;dirty=false;camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight,occupied=[];for(const p of picks){const v=p.pos.clone().project(camera),xx=(v.x+1)*w/2,yy=(1-v.y)*h/2,tw=p.name.length*12+16;const rect={x:xx-tw/2,y:yy-23,w:tw,h:26};let show=labelOn&&v.z<1&&xx>tw/2&&xx<w-tw/2&&yy>26&&yy<h-8&&!occupied.some(r=>rect.x<r.x+r.w+6&&rect.x+rect.w+6>r.x&&rect.y<r.y+r.h+5&&rect.y+rect.h+5>r.y);p.el.style.display=show?'block':'none';if(show){occupied.push(rect);p.el.style.left=xx+'px';p.el.style.top=yy+'px';}}
  const names=['南','东南','东','东北','北','西北','西','西南'];let n=((Math.round(theta/(Math.PI/4))%8)+8)%8;root.querySelector('.palace-bearing').textContent=phi<.15?'俯视 · 北在上':names[n]+'侧视角';
 }
 function invalidate(){dirty=true;requestAnimationFrame(draw);}
 function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;const factor=Math.max(1,1.15/camera.aspect);if(previousAspect===null)radius*=factor;else radius*=factor/previousAspect;previousAspect=factor;camera.updateProjectionMatrix();invalidate();}
 const ro=new ResizeObserver(resize);ro.observe(stage);
 function pan(dx,dy){const scale=radius*.001;target.x+=(-Math.cos(theta)*dx+Math.sin(theta)*dy)*scale;target.z+=(Math.sin(theta)*dx+Math.cos(theta)*dy)*scale;target.x=T.MathUtils.clamp(target.x,-550,550);target.z=T.MathUtils.clamp(target.z,-650,650);}
 for(const name of ['pointerdown','wheel','keydown'])canvas.addEventListener(name,()=>parent.postMessage({type:'palace-interact'},location.origin));const pointers=new Map();let pinch=null;let startPoint=null;
 canvas.addEventListener('pointerdown',e=>{startPoint={x:e.clientX,y:e.clientY,button:e.button};canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null;});
 canvas.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);if(!prev)return;const dx=e.clientX-prev.x,dy=e.clientY-prev.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)radius=T.MathUtils.clamp(radius*pinch/dist,95,2400);pinch=dist;}else if(e.buttons===2||e.shiftKey){pan(dx,dy);}else{theta-=dx*.006;phi=T.MathUtils.clamp(phi+dy*.005,.035,1.49);}invalidate();});
 function end(e){if(e.type==='pointerup'&&startPoint&&startPoint.button===0&&Math.hypot(e.clientX-startPoint.x,e.clientY-startPoint.y)<5){const rect=canvas.getBoundingClientRect(),ray=new T.Raycaster();ray.setFromCamera(new T.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),camera);const hit=ray.intersectObjects(hitBoxes)[0];if(hit)parent.postMessage({type:'palace-select',building:hit.object.userData.building},location.origin);}pointers.delete(e.pointerId);pinch=null;startPoint=null;}
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);canvas.addEventListener('contextmenu',e=>e.preventDefault());
 canvas.addEventListener('wheel',e=>{e.preventDefault();radius=T.MathUtils.clamp(radius*Math.exp(e.deltaY*.001),95,2400);invalidate();},{passive:false});
 root.querySelector('#palace-axis').addEventListener('change',e=>{axis.visible=e.target.checked;invalidate();});root.querySelector('#palace-labels').addEventListener('change',e=>{labelOn=e.target.checked;invalidate();});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();loading.textContent='三维显示已暂停，请重新打开此视图。';loading.style.display='grid';});
 root.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let used=true;if(e.key==='ArrowLeft')theta+=.12;else if(e.key==='ArrowRight')theta-=.12;else if(e.key==='ArrowUp')phi=Math.max(.035,phi-.08);else if(e.key==='ArrowDown')phi=Math.min(1.49,phi+.08);else if(e.key==='+')radius=Math.max(95,radius*.9);else if(e.key==='-')radius=Math.min(2400,radius*1.1);else used=false;if(used){e.preventDefault();invalidate();}});
 const hitBoxes=buildings.map(b=>{const m=new T.Mesh(new T.BoxGeometry(b.w+4,b.h+14,b.d+4),new T.MeshBasicMaterial({visible:false}));m.position.set(b.x,(b.opt.base||1.5)+b.h/2+5,b.z);m.userData.building=b;scene.add(m);m.updateMatrixWorld();return m;});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data.type==='palace-request-ready'){parent.postMessage({type:'palace-ready',count:buildings.length},location.origin);}if(e.data.type==='palace-camera'){const a=e.data.action;if(a==='rotate'&&Number.isFinite(e.data.amount))theta+=e.data.amount;else if(a==='left')theta+=Math.PI/12;else if(a==='right')theta-=Math.PI/12;else if(a==='in')radius=T.MathUtils.clamp(radius*.8,95,6000);else if(a==='out')radius=T.MathUtils.clamp(radius/ .8,95,6000);else if(a==='up')phi=Math.max(.035,phi-.15);else if(a==='down')phi=Math.min(1.49,phi+.15);invalidate();}if(e.data.type==='palace-reset'){theta=.24;phi=.82;radius=1680*Math.max(1,1.15/camera.aspect);target.set(0,0,20);invalidate();}});parent.postMessage({type:'palace-ready',count:buildings.length},location.origin);resize();loading.style.display='none';root.dataset.ready='true';
 window.__palaceDebug={renderer,scene,camera,getView:()=>({theta,phi,radius,target:target.toArray()}),setView:(t,p,r)=>{theta=t;phi=p;radius=r;invalidate();},buildings:picks.length};
 }catch(err){loading.textContent='三维场景未能启动：'+err.message;loading.setAttribute('role','alert');console.error(err);}
